#version: "3.9"

services:
  
  game-backend:
    container_name: game-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    restart: always
    volumes:
      - .:/backend
    networks:
      - ai-advisor-networks

networks:
  ai-advisor-networks:
    driver: bridge